<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🚀 DevOps Dashboard</h1>

        <p>
            Proyecto de demostración de Docker, CI/CD,
            Kubernetes y Terraform.
        </p>

        <section class="technologies">
            <div class="card completed">
                <span>✓</span>
                <h2>Docker</h2>
                <p>Completado</p>
            </div>

            <div class="card">
                <span>○</span>
                <h2>Git</h2>
                <p>En progreso</p>
            </div>

            <div class="card">
                <span>○</span>
                <h2>Kubernetes</h2>
                <p>Pendiente</p>
            </div>

            <div class="card">
                <span>○</span>
                <h2>Terraform</h2>
                <p>Pendiente</p>
            </div>

            <div class="card">
                <span>○</span>
                <h2>CI/CD</h2>
                <p>Pendiente</p>
            </div>

            <div class="card">
                <span>○</span>
                <h2>Monitoring</h2>
                <p>Pendiente</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
