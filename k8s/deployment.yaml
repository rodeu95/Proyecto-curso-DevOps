
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-dashboard
  template:
    metadata:
      labels:
        app: devops-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/rodeu95/proyecto-curso-devops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
